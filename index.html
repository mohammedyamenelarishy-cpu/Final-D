<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار قواعد البيانات — Views &amp; Joins</title>
<style>
  :root{
    --bg-0:#081321;
    --bg-1:#0d1f36;
    --panel:#0f2745;
    --panel-2:#122c50;
    --line: rgba(245,185,66,0.18);
    --gold:#f5b942;
    --gold-dim: #c99530;
    --teal:#6fe3c4;
    --text:#e9eefb;
    --muted:#8ea0c4;
    --danger:#ef7d7d;
    --mono: 'Consolas','SFMono-Regular','Menlo','Courier New', monospace;
    --sans: 'Segoe UI', Tahoma, 'Cairo', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(245,185,66,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(111,227,196,0.07), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .titlebar{
    display:flex;align-items:center;gap:12px;
    margin-bottom:22px;
  }
  .titlebar .chip{
    width:44px;height:44px;border-radius:10px;
    background:linear-gradient(145deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);color:var(--gold);font-weight:700;font-size:18px;
    flex:0 0 auto;
  }
  .titlebar h1{
    font-size:19px;margin:0;line-height:1.4;
    font-weight:700;
  }
  .titlebar p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  .progress-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;font-size:13px;color:var(--muted);
    font-family:var(--mono);
  }
  .progress-track{
    height:6px;border-radius:6px;background:rgba(255,255,255,0.06);
    overflow:hidden;margin-bottom:24px;border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;border-radius:6px;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition:width .35s ease;
  }

  .card{
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 24px 22px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.6;
  }
  .kicker{
    font-family:var(--mono);font-size:12px;color:var(--teal);
    letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 8px var(--teal);}

  .prompt-label{
    font-family:var(--mono);color:var(--gold);font-size:13px;margin-bottom:6px;
    letter-spacing:.04em;
  }
  .content-block{
    direction:ltr;text-align:left;
    font-family:var(--mono);
    font-size:15.5px;
    line-height:1.85;
    color:var(--text);
    white-space:normal;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:6px;
  }
  .content-block.answer{
    border-color: rgba(111,227,196,0.28);
    background: rgba(111,227,196,0.05);
  }

  .word{
    cursor:pointer;
    border-bottom:1.5px dotted rgba(245,185,66,0.55);
    border-radius:2px;
    transition:background .15s ease, color .15s ease;
    padding:0 1px;
  }
  .word:hover{background:rgba(245,185,66,0.14);}
  .word.active{background:rgba(245,185,66,0.28);color:#fff;border-bottom-color:var(--gold);}
  .answer .word{border-bottom-color:rgba(111,227,196,0.55);}
  .answer .word:hover{background:rgba(111,227,196,0.16);}
  .answer .word.active{background:rgba(111,227,196,0.3);border-bottom-color:var(--teal);}

  .answer-wrap{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .4s ease, opacity .3s ease, margin .3s ease;
    margin-top:0;
  }
  .answer-wrap.show{
    max-height:600px;opacity:1;margin-top:16px;
  }
  .answer-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:12px;color:var(--teal);
    margin-bottom:8px;letter-spacing:.05em;
  }

  .controls{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:22px;gap:10px;
  }
  .btn{
    font-family:var(--sans);font-weight:600;font-size:14.5px;
    border-radius:10px;border:1px solid transparent;
    padding:12px 20px;cursor:pointer;transition:transform .12s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(135deg, var(--gold), var(--gold-dim));
    color:#1a1300;flex:1;
  }
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-ghost{
    background:transparent;border-color:rgba(255,255,255,0.14);
    color:var(--muted);
  }
  .btn-ghost:hover{color:var(--text);border-color:rgba(255,255,255,0.3);}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed;}

  .hint{
    text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px;
    font-family:var(--sans);
  }

  /* tooltip */
  #tooltip{
    position:fixed;z-index:50;
    background:#fffbe9;
    color:#1a1300;
    border:1px solid var(--gold);
    border-radius:8px;
    padding:8px 12px;
    font-family:var(--sans);
    font-size:13.5px;
    max-width:260px;
    box-shadow:0 10px 24px rgba(0,0,0,0.4);
    display:none;
    direction:rtl;text-align:right;
    line-height:1.5;
  }
  #tooltip .en{
    display:block;font-family:var(--mono);color:var(--gold-dim);
    font-size:11.5px;margin-bottom:3px;direction:ltr;text-align:left;
  }
  #tooltip::after{
    content:"";position:absolute;bottom:-6px;right:16px;
    width:12px;height:12px;background:#fffbe9;border-right:1px solid var(--gold);
    border-bottom:1px solid var(--gold);transform:rotate(45deg);
  }

  /* completion */
  .done-wrap{text-align:center;padding:20px 6px;}
  .done-wrap .big{font-size:44px;margin-bottom:6px;}
  .done-wrap h2{margin:6px 0 6px;font-size:20px;}
  .done-wrap p{color:var(--muted);font-size:14px;margin-bottom:20px;}

  @media (max-width:480px){
    .content-block{font-size:14px;padding:14px;}
    .card{padding:20px 16px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="titlebar">
    <div class="chip">SQL</div>
    <div>
      <h1>اختبار قواعد البيانات — Views &amp; Joins</h1>
      <p>اضغط على أي كلمة إنجليزية لعرض معناها بالعربي</p>
    </div>
  </div>

  <div class="progress-row">
    <span id="progressText">سؤال 1 من 20</span>
    <span id="progressPct">5%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>

  <div class="card" id="quizCard">
    <div class="kicker"><span class="dot"></span> <span id="typeLabel">SQL QUERY</span></div>

    <div class="prompt-label">السؤال:</div>
    <div class="content-block" id="questionBlock"></div>

    <div class="answer-wrap" id="answerWrap">
      <div class="answer-tag">✓ الإجابة الصحيحة</div>
      <div class="content-block answer" id="answerBlock"></div>
    </div>

    <div class="controls">
      <button class="btn btn-ghost" id="prevBtn">◀ السابق</button>
      <button class="btn btn-primary" id="nextBtn">إظهار الإجابة</button>
    </div>
  </div>

  <div class="card" id="doneCard" style="display:none;">
    <div class="done-wrap">
      <div class="big">🎓</div>
      <h2>انتهيت من كل الأسئلة!</h2>
      <p>راجعت 20 سؤال عن الـ Views والـ Joins والمصطلحات الأساسية في قواعد البيانات.</p>
      <button class="btn btn-primary" id="restartBtn" style="flex:none;">إعادة الاختبار من البداية</button>
    </div>
  </div>

  <div class="hint">اضغط في أي مكان فاضي لإغلاق مربع الترجمة</div>
</div>

<div id="tooltip"></div>

<script>
const questions = [

  },
  {
    type:"SQL QUERY",
    q:"Retrieve the project number, department number, last name, birth date, and address of all employees who manage departments that control projects located in Stafford.",
    a:"SELECT PNUMBER, DNUM, LNAME, BDATE, ADDRESS\nFROM PROJECT, DEPARTMENT, EMPLOYEE\nWHERE DNUM=DNUMBER AND MGRSSN=SSN AND PLOCATION='Stafford'"
  },
  {
    type:"SQL QUERY",
    q:"Retrieve the total number of employees in the company.",
    a:"SELECT COUNT(*)\nFROM EMPLOYEE"
  },
  {
    type:"SQL QUERY",
    q:"Retrieve the number of employees in the 'Research' department.",
    a:"SELECT COUNT(*)\nFROM EMPLOYEE, DEPARTMENT\nWHERE DNO=DNUMBER AND DNAME='Research'"
  },
  {
    type:"SQL QUERY",
    q:"Find the department number, the total number of employees, and the average salary for each department from the Employee table. Group the results by department number (DNO).",
    a:"SELECT DNO, COUNT(*), AVG(SALARY)\nFROM EMPLOYEE\nGROUP BY DNO"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"What is the correct syntax to drop a view?\nA) DELETE VIEW view_name;\nB) DROP VIEW view_name;\nC) REMOVE VIEW view_name;\nD) TRUNCATE VIEW view_name;",
    a:"B) DROP VIEW view_name;"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"What is the purpose of the SQL INNER JOIN keyword?\nA) To return unmatched records from the left table\nB) To return unmatched records from the right table\nC) To select only the records that have matching values in both tables",
    a:"C) To select only the records that have matching values in both tables"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"What happens when there is no match between tables in an INNER JOIN?\nA) The unmatched rows from both tables are returned\nB) The unmatched rows from the left table are returned\nC) The unmatched rows from the right table are returned\nD) No rows are returned for the unmatched entries",
    a:"D) No rows are returned for the unmatched entries"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"Given Employees as the left table and Departments as the right table, which join type would return all departments including those that have no employees assigned?\nA) INNER JOIN\nB) LEFT JOIN\nC) RIGHT JOIN\nD) FULL JOIN",
    a:"C) RIGHT JOIN"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"Which SQL command grants permissions to a user?\nA) ALLOW\nB) PERMIT\nC) GRANT\nD) ACCESS",
    a:"C) GRANT"
  },
  {
    type:"MULTIPLE CHOICE",
    q:"What is the purpose of the REVOKE command?\nA) To create a user\nB) To remove user permissions\nC) To update data\nD) To delete a table",
    a:"B) To remove user permissions"
  },
  {
    type:"ONE TERM",
    q:"Give one term: A software package/system to facilitate the creation and maintenance of a computerized database.",
    a:"Database Management System (DBMS)"
  },
  {
    type:"ONE TERM",
    q:"Which part of SQL is used to create and modify the structure of database objects such as tables and databases?",
    a:"Data Definition Language (DDL)"
  },
  {
    type:"ONE TERM",
    q:"Give one term: Link between entities (corresponds to primary key–foreign key equivalencies in related tables).",
    a:"Relationship"
  },
  {
    type:"ONE WORD",
    q:"Give one word: A SQL Server command used to explicitly prevent users or roles from accessing or performing actions on database objects, even if permissions were granted through another role.",
    a:"DENY"
  },
  {
    type:"ONE WORD",
    q:"Give one word: A database design process that organizes data into specific table structures. It helps improve data integrity, prevent data anomalies, minimize data redundancy, and improve query performance.",
    a:"Database Normalization"
  },
  {
    type:"ONE WORD",
    q:"Give one word: Used to represent complex relationships, real-world hierarchies, inheritance, and categories more clearly and accurately. It helps create better database designs.",
    a:"Extended Entity-Relationship (EER) model"
  },
  {
    type:"ONE WORD",
    q:"Give one word: Used to control permission on database objects. Includes commands such as GRANT and REVOKE.",
    a:"DCL — Data Control Language"
  },
  {
    type:"ONE WORD",
    q:"Give one word: This operator is used to combine the result-set of two or more SELECT statements. It automatically removes duplicate rows from the result set.",
    a:"UNION operator"
  }
];

const dict = {

let idx = 0;
let answerShown = false;

const questionBlock = document.getElementById('questionBlock');
const answerBlock = document.getElementById('answerBlock');
const answerWrap = document.getElementById('answerWrap');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const progressText = document.getElementById('progressText');
const progressPct = document.getElementById('progressPct');
const progressFill = document.getElementById('progressFill');
const typeLabel = document.getElementById('typeLabel');
const quizCard = document.getElementById('quizCard');
const doneCard = document.getElementById('doneCard');
const tooltip = document.getElementById('tooltip');

function wordify(str){
  return str.split('\n').map(line=>{
    return line.replace(/[A-Za-z][A-Za-z\-]{1,}/g, (m)=>{
      return '<span class="word" data-word="'+m+'">'+m+'</span>';
    });
  }).join('<br>');
}

function render(){
  const item = questions[idx];
  typeLabel.textContent = item.type;
  questionBlock.innerHTML = wordify(item.q);
  answerBlock.innerHTML = wordify(item.a);
  answerWrap.classList.remove('show');
  answerShown = false;
  nextBtn.textContent = "إظهار الإجابة";
  prevBtn.disabled = (idx === 0);
  progressText.textContent = "سؤال " + (idx+1) + " من " + questions.length;
  const pct = Math.round(((idx+1)/questions.length)*100);
  progressPct.textContent = pct + "%";
  progressFill.style.width = pct + "%";
  hideTooltip();
}

function showDone(){
  quizCard.style.display = 'none';
  doneCard.style.display = 'block';
  hideTooltip();
}

nextBtn.addEventListener('click', ()=>{
  if(!answerShown){
    answerWrap.classList.add('show');
    answerShown = true;
    nextBtn.textContent = (idx < questions.length-1) ? "السؤال التالي ◀" : "إنهاء الاختبار";
  } else {
    if(idx < questions.length-1){
      idx++;
      render();
    } else {
      showDone();
    }
  }
});

prevBtn.addEventListener('click', ()=>{
  if(idx > 0){
    idx--;
    render();
  }
});

document.getElementById('restartBtn').addEventListener('click', ()=>{
  idx = 0;
  doneCard.style.display = 'none';
  quizCard.style.display = 'block';
  render();
});

document.addEventListener('click', (e)=>{
  const wordEl = e.target.closest('.word');
  if(wordEl){
    document.querySelectorAll('.word.active').forEach(w=>w.classList.remove('active'));
    wordEl.classList.add('active');
    const raw = wordEl.getAttribute('data-word');
    const key = raw.toLowerCase();
    const meaning = dict[key] || "لا توجد ترجمة متاحة لهذه الكلمة";
    tooltip.innerHTML = '<span class="en">'+raw+'</span>' + meaning;
    const rect = wordEl.getBoundingClientRect();
    tooltip.style.display = 'block';
    const ttRect = tooltip.getBoundingClientRect();
    let left = rect.left + (rect.width/2) - (ttRect.width/2);
    left = Math.max(10, Math.min(left, window.innerWidth - ttRect.width - 10));
    let top = rect.top - ttRect.height - 12;
    if(top < 8){ top = rect.bottom + 12; }
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
    e.stopPropagation();
  } else if(!e.target.closest('#tooltip')){
    hideTooltip();
  }
});

function hideTooltip(){
  tooltip.style.display = 'none';
  document.querySelectorAll('.word.active').forEach(w=>w.classList.remove('active'));
}

render();
</script>
</body>
</html>
